name: Test Notebooks

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  test-ml-notebooks:
    name: Test ML Clásico Notebooks
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]
        notebook:
          - "rutas/01-ml-clasico/01-regresion-lineal.ipynb"
          - "rutas/01-ml-clasico/02-gradient-descent.ipynb"
          - "rutas/01-ml-clasico/03-regresion-logistica.ipynb"
          - "rutas/01-ml-clasico/04-regresion-softmax.ipynb"
          - "rutas/01-ml-clasico/05-arboles-decision.ipynb"
      fail-fast: false

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install nbconvert jupyter pytest

    - name: Execute notebook
      run: |
        jupyter nbconvert --to notebook --execute \
          --ExecutePreprocessor.timeout=600 \
          --output-dir=/tmp \
          "${{ matrix.notebook }}"

    - name: Upload notebook outputs
      if: failure()
      uses: actions/upload-artifact@v3
      with:
        name: failed-notebook-${{ matrix.python-version }}
        path: /tmp/*.ipynb

  test-rl-notebooks:
    name: Test RL Clásico Notebooks
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10"]
        notebook:
          - "rutas/02-rl-clasico/01-fundamentos-agentes.ipynb"
          - "rutas/02-rl-clasico/02-mdp-bellman.ipynb"
      fail-fast: false

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install nbconvert jupyter

    - name: Execute notebook (with reduced iterations for CI)
      run: |
        jupyter nbconvert --to notebook --execute \
          --ExecutePreprocessor.timeout=900 \
          --output-dir=/tmp \
          "${{ matrix.notebook }}"

  lint-notebooks:
    name: Lint Notebooks
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"

    - name: Install nbqa and flake8
      run: |
        pip install nbqa flake8 black isort

    - name: Check code style with black
      run: |
        nbqa black --check rutas/ || true

    - name: Check imports with isort
      run: |
        nbqa isort --check-only rutas/ || true

    - name: Lint with flake8
      run: |
        nbqa flake8 rutas/ --ignore=E501,W503,E203 || true

  check-links:
    name: Check Markdown Links
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Check links in markdown files
      uses: gaurav-nelson/github-action-markdown-link-check@v1
      with:
        use-quiet-mode: 'yes'
        config-file: '.github/markdown-link-check-config.json'
        check-modified-files-only: 'yes'
      continue-on-error: true

  test-imports:
    name: Test Shared Utilities
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Test imports
      run: |
        python -c "from shared.utils import visualization, testing, datasets; print('✅ All imports successful')"

    - name: Run basic tests
      run: |
        python -c "
        import numpy as np
        from shared.utils.visualization import plot_regression_line
        from shared.utils.testing import check_shape
        from shared.utils.datasets import generate_synthetic_regression

        # Test dataset generation
        X_train, X_test, y_train, y_test = generate_synthetic_regression(n_samples=50)
        print(f'✅ Dataset generated: {X_train.shape}')

        # Test check function
        check_fn = check_shape((50, 1))
        passed, msg = check_fn(X_train)
        assert passed, msg
        print('✅ Shape check passed')

        print('✅ All basic tests passed')
        "

  build-status:
    name: Build Status
    runs-on: ubuntu-latest
    needs: [test-ml-notebooks, test-rl-notebooks, lint-notebooks, test-imports]
    if: always()

    steps:
    - name: Check build status
      run: |
        if [ "${{ needs.test-ml-notebooks.result }}" == "success" ] && \
           [ "${{ needs.test-rl-notebooks.result }}" == "success" ] && \
           [ "${{ needs.test-imports.result }}" == "success" ]; then
          echo "✅ All tests passed!"
          exit 0
        else
          echo "❌ Some tests failed"
          exit 1
        fi
